{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-lg-8">
<div class="card shadow-sm">
    <div class="card-header">
        <h3 class="mb-0">{{ title }}</h3>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Roll Number</label>
                    <input name="roll_no" class="form-control" required
                           value="{{ student.roll_no if student else '' }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Name</label>
                    <input name="name" class="form-control" required
                           value="{{ student.name if student else '' }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required
                           value="{{ student.email if student else '' }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone</label>
                    <input name="phone" class="form-control"
                           value="{{ student.phone if student else '' }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Department</label>
                    <input name="department" class="form-control"
                           value="{{ student.department if student else '' }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Year</label>
                    <input type="number" name="year" min="1" max="6"
                           class="form-control"
                           value="{{ student.year if student else '' }}">
                </div>

                <div class="col-12 mb-3">
                    <label class="form-label">Address</label>
                    <textarea name="address" class="form-control" rows="3">{{ student.address if student else '' }}</textarea>
                </div>
            </div>

            <button class="btn btn-primary">{{ "Update" if student else "Add" }} Student</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
</div>
</div>
{% endblock %}
